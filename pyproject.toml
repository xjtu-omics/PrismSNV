[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prismsnv"
version = "0.1.0"
description = "Single-cell SNV functional effect analysis toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Peisen Sun", email = "sunpeisen@stu.xjtu.edu.cn" },
  { name = "Kai Ye", email = "kaiye@xjtu.edu.cn" },
]
keywords = [
  "single-cell",
  "SNV",
  "variant effect",
  "perturbation",
  "bioinformatics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "anndata==0.11.4",
  "matplotlib==3.10.9",
  "numba==0.67.0",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "pysam==0.24.0",
  "PyYAML==6.0.3",
  "igraph==1.0.0",
  "leidenalg==0.12.0",
  "scanpy==1.12.4",
  "scipy==1.15.3",
  "scrublet==0.2.3",
  "torch==2.12.0",
  "tqdm==4.65.0",
  "scikit-learn==1.7.2",
]

[project.urls]
Homepage = "https://github.com/xjtu-omics/PrismSNV"
Documentation = "https://muledoc.readthedocs.io/en/latest/index.html"
Issues = "https://github.com/xjtu-omics/PrismSNV/issues"

[project.scripts]
prismsnv = "prismsnv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"prismsnv.preprocess" = ["bam2vcf.sh", "vendor/*.jar", "vendor/*.txt", "vendor/*.md"]
"prismsnv.templates" = ["train_config.yaml"]
